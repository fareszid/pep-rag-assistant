[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pepbot"
version = "1.0.0"
description = "RAG assistant for Python Enhancement Proposals: hybrid retrieval, reranking, cited answers from Claude, and a retrieval evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.0",
    "fastembed>=0.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
pepbot = "pepbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
